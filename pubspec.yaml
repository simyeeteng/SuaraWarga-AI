name: suarawarga_ai
description: SuaraWarga AI — Voice-first government services assistant for Malaysian senior citizens.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Voice features
  speech_to_text: ^7.4.0
  flutter_tts: ^3.8.3

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # API & Networking
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # Camera & OCR
  camera: ^0.10.5
  google_ml_kit: ^0.16.0
  image_picker: ^1.1.2

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
